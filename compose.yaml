name: solo98-graindesk
services:
  desk:
    build:
      context: .
      args:
        GRAINDESK_RUNTIME_IMAGE: ${GRAINDESK_RUNTIME_IMAGE:-python:3.12-slim}
    image: ${GRAINDESK_IMAGE:-solo98-graindesk:1.0}
    network_mode: bridge
    environment:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
    ports:
      - "127.0.0.1:${GRAINDESK_PORT:-19898}:8000"
    volumes:
      - grain-data:/var/lib/grain_desk
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; assert urlopen('http://127.0.0.1:8000/grain/health', timeout=3).status == 200"]
      interval: 3s
      timeout: 4s
      retries: 12
volumes:
  grain-data:
